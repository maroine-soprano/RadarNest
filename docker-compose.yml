version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: mongodb-container
    ports:
      - "27017:27017"
    volumes:
      - ./database/data:/data/db
      - ./database/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
  frontend:
    image: maroinekhallou/radar-front-image
    container_name: radar-frontend-container
    ports:
      - "4200:80"
  backend:
    image: maroinekhallou/radar-backend-image
    container_name: radar-backend-container
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongodb-container:27017/radar
      - LLM_URI=http://host.docker.internal:8000/generate-strategy
